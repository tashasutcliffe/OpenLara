name: Build Mario TR4 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Patch legacy JCenter repositories to Google Maven
        working-directory: src/platform/android
        run: |
          sed -i 's/jcenter()/google()\n        mavenCentral()/g' build.gradle
          sed -i 's/jcenter()/google()\n        mavenCentral()/g' app/build.gradle || true

      - name: Build Debug APK
        working-directory: src/platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioTR4-Debug-APK
          path: src/platform/android/app/build/outputs/apk/debug/*.apk
