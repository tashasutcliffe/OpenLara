name: Build Mario TR4 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Upgrade Legacy Gradle 4.1 & AGP 3.0.1 to Modern Toolchain
        working-directory: src/platform/android
        run: |
          # Upgrade Gradle wrapper from 4.1 to 7.5.1
          sed -i 's/gradle-4.1-all.zip/gradle-7.5.1-all.zip/g' gradle/wrapper/gradle-wrapper.properties

          # Replace dead jcenter() with google() and mavenCentral(), and upgrade AGP to 7.4.2
          sed -i 's/jcenter()/google()\n        mavenCentral()/g' build.gradle
          sed -i 's/com.android.tools.build:gradle:3.0.1/com.android.tools.build:gradle:7.4.2/g' build.gradle
          sed -i 's/jcenter()/google()\n        mavenCentral()/g' app/build.gradle || true

          # Remove deprecated compileSdkVersion/buildToolsVersion conflicts if present and ensure modern compileSdk
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 33/g' app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 33/g' app/build.gradle || true
          sed -i '/buildToolsVersion/d' app/build.gradle || true

      - name: Build Debug APK
        working-directory: src/platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioTR4-Debug-APK
          path: src/platform/android/app/build/outputs/apk/debug/*.apk
